    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #eef2f5 100%); }
        .arabic-text { font-family: 'Amiri', serif; line-height: 1.9; direction: rtl; font-size: 1.3rem; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border: 1px solid rgba(16, 185, 129, 0.12);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        
        .book-card {
            background: white;
            transition: all 0.25s ease;
        }
        .book-card:hover {
            background: linear-gradient(105deg, #ffffff 0%, #f0fdf4 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 20px -10px rgba(16, 185, 129, 0.2);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%) scale(0.96); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.25s ease-out forwards; }
        
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 1000px 100%;
            animation: shimmer 1.5s infinite;
        }
        
        .step-active {
            background: #10b981;
            color: white;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }
        .step-completed {
            background: #10b981;
            color: white;
        }
        .step-inactive {
            background: #cbd5e1;
            color: #64748b;
        }
        
        .retry-btn {
            transition: all 0.2s ease;
        }
        .retry-btn:hover {
            transform: rotate(180deg);
        }
    </style>
</head>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            menu.classList.toggle('hidden');
            if (menu.classList.contains('hidden')) {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            } else {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            }
        }
    </script>

        <div id="progress-steps" class="flex items-center justify-center mb-10 gap-2 md:gap-4"></div>

            <p class="text-sm text-slate-400">© 2026 Noor Portal · Authentic Islamic Resources</p>
        </div>

<script src="navbar.js"></script>
    <script>
        // FALLBACK HADITH BOOKS DATA - In case API is down
        const FALLBACK_BOOKS = [
            { bookSlug: "bukhari", bookName: "Sahih al-Bukhari", chapters_count: 97, hadiths_count: 7563, color: "#10b981" },
            { bookSlug: "muslim", bookName: "Sahih Muslim", chapters_count: 56, hadiths_count: 7563, color: "#059669" },
            { bookSlug: "abudawood", bookName: "Sunan Abi Dawood", chapters_count: 43, hadiths_count: 5274, color: "#3b82f6" },
            { bookSlug: "tirmidhi", bookName: "Jami' at-Tirmidhi", chapters_count: 46, hadiths_count: 3956, color: "#8b5cf6" },
            { bookSlug: "nasai", bookName: "Sunan an-Nasa'i", chapters_count: 51, hadiths_count: 5761, color: "#f59e0b" },
            { bookSlug: "ibnmajah", bookName: "Sunan Ibn Majah", chapters_count: 37, hadiths_count: 4341, color: "#ef4444" }
        ];
        
        // Fallback chapters data for each book
        const FALLBACK_CHAPTERS = {
            bukhari: Array.from({ length: 30 }, (_, i) => ({ chapterNumber: i+1, name: `Chapter ${i+1}`, hadiths_count: Math.floor(Math.random() * 200) + 50 })),
            muslim: Array.from({ length: 25 }, (_, i) => ({ chapterNumber: i+1, name: `Book ${i+1}`, hadiths_count: Math.floor(Math.random() * 180) + 40 })),
            abudawood: Array.from({ length: 28 }, (_, i) => ({ chapterNumber: i+1, name: `Section ${i+1}`, hadiths_count: Math.floor(Math.random() * 150) + 30 })),
            tirmidhi: Array.from({ length: 26 }, (_, i) => ({ chapterNumber: i+1, name: `Chapter ${i+1}`, hadiths_count: Math.floor(Math.random() * 130) + 25 })),
            nasai: Array.from({ length: 29 }, (_, i) => ({ chapterNumber: i+1, name: `Book ${i+1}`, hadiths_count: Math.floor(Math.random() * 160) + 35 })),
            ibnmajah: Array.from({ length: 32 }, (_, i) => ({ chapterNumber: i+1, name: `Chapter ${i+1}`, hadiths_count: Math.floor(Math.random() * 140) + 28 }))
        };
        
        // Fallback Hadith data
        function getFallbackHadiths(bookSlug, chapterNum, page, perPage = 8) {
            const startIdx = (page - 1) * perPage;
            const hadiths = [];
            for (let i = 1; i <= perPage; i++) {
                const hadithNumber = startIdx + i;
                hadiths.push({
                    hadithNumber: hadithNumber,
                    englishNarrator: `Narrated by ${['Abu Hurairah', 'Ibn Umar', 'Aisha', 'Anas bin Malik', 'Ibn Abbas'][Math.floor(Math.random() * 5)]} (may Allah be pleased with him)`,
                    hadithEnglish: `The Messenger of Allah ﷺ said: "The example of the one who remembers his Lord and the one who does not remember his Lord is like the example of the living and the dead." (Chapter ${chapterNum}, Hadith #${hadithNumber})`,
                    hadithArabic: `مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ وَالَّذِي لاَ يَذْكُرُ رَبَّهُ مَثَلُ الْحَىِّ وَالْمَيِّتِ`,
                    hadithUrdu: `رسول اللہ ﷺ نے فرمایا: "جو شخص اپنے رب کو یاد کرتا ہے اور جو یاد نہیں کرتا، ان کی مثال زندہ اور مردہ جیسی ہے۔"`
                });
            }
            return {
                data: hadiths,
                current_page: page,
                last_page: 15,
                next_page_url: page < 15 ? `page_${page+1}` : null
            };
        }

        const WORKER_URL = 'https://hdith-api.fakcloud.tech'; 
        
        const STATE = {
            STEP_BOOK_SELECT: 0,
            STEP_CHAPTER_SELECT: 1,
            STEP_HADITH_VIEW: 2,
        };

        let currentState = STATE.STEP_BOOK_SELECT;
        let bookData = [];
        let selectedBookSlug = '';
        let selectedBookName = '';
        let chapterData = [];
        let selectedChapterNumber = '';
        let selectedChapterName = '';
        let currentHadithPage = 1;
        let totalHadithPages = 1;
        let isUsingFallback = false;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'error' ? 'bg-gradient-to-r from-rose-500 to-rose-600' : 
                          (type === 'info' ? 'bg-gradient-to-r from-blue-500 to-indigo-500' : 'bg-gradient-to-r from-emerald-600 to-teal-600');
            const icon = type === 'error' ? 'fa-circle-exclamation' : (type === 'info' ? 'fa-circle-info' : 'fa-circle-check');
            toast.className = `${colors} text-white px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 toast-enter pointer-events-auto backdrop-blur-sm`;
            toast.innerHTML = `<i class="fas ${icon} text-lg"></i> <span class="font-medium text-sm">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function updateProgressSteps() {
            const container = document.getElementById('progress-steps');
            const steps = [
                { name: 'Select Book', icon: 'fa-book', state: STATE.STEP_BOOK_SELECT },
                { name: 'Choose Chapter', icon: 'fa-list-ol', state: STATE.STEP_CHAPTER_SELECT },
                { name: 'Read Hadiths', icon: 'fa-quran', state: STATE.STEP_HADITH_VIEW }
            ];
            
            let html = '<div class="flex items-center gap-1 md:gap-3 flex-wrap justify-center">';
            steps.forEach((step, idx) => {
                let isActive = (currentState === step.state);
                let isCompleted = (currentState > step.state);
                let circleClass = isActive ? 'step-active' : (isCompleted ? 'step-completed' : 'step-inactive');
                
                html += `
                    <div class="flex items-center">
                        <div class="flex flex-col items-center">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center ${circleClass} transition-all duration-200 shadow-md">
                                <i class="fas ${step.icon} text-sm"></i>
                            </div>
                            <span class="text-xs mt-1 font-medium ${isActive ? 'text-emerald-700' : 'text-slate-400'} hidden sm:block">${step.name}</span>
                        </div>
                        ${idx < steps.length-1 ? '<i class="fas fa-chevron-right text-slate-300 text-xs mx-1 md:mx-2"></i>' : ''}
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderUI() {
            const area = document.getElementById('content-area');
            if (currentState === STATE.STEP_BOOK_SELECT) {
                area.innerHTML = renderBookSelection();
            } else if (currentState === STATE.STEP_CHAPTER_SELECT) {
                area.innerHTML = renderChapterSelection();
            } else if (currentState === STATE.STEP_HADITH_VIEW) {
                area.innerHTML = renderHadithView();
            }
            updateProgressSteps();
        }

        function renderBookSelection() {
            const displayBooks = bookData.length > 0 ? bookData : FALLBACK_BOOKS;
            return `
                <div class="glass-card rounded-2xl shadow-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-emerald-50 to-teal-50 px-6 py-5 border-b border-emerald-100">
                        <div class="flex justify-between items-center flex-wrap gap-3">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2"><i class="fas fa-book-open text-emerald-600"></i> Select a Hadith Collection</h2>
                                <p class="text-slate-500 text-sm mt-1">Choose from authentic six books (Kutub al-Sittah)</p>
                            </div>
                            <button onclick="fetchBooks()" class="text-sm bg-white/70 hover:bg-white text-slate-600 px-4 py-2 rounded-xl transition flex items-center gap-2">
                                <i class="fas fa-sync-alt retry-btn"></i> Refresh
                            </button>
                        </div>
                        ${isUsingFallback ? '<div class="mt-3 text-amber-600 text-xs bg-amber-50 p-2 rounded-lg"><i class="fas fa-exclamation-triangle mr-1"></i> Using offline data — API connection issue</div>' : ''}
                    </div>
                    <div class="p-6">
                        <div id="book-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 max-h-[55vh] overflow-y-auto pr-2">
                            ${displayBooks.map(book => `
                                <div onclick="selectBook('${book.bookSlug}', '${book.bookName.replace(/'/g, "\\'")}')" 
                                    class="book-card rounded-xl p-5 cursor-pointer border border-slate-100 shadow-sm hover:shadow-lg transition-all duration-200">
                                    <div class="flex items-start justify-between">
                                        <div class="w-12 h-12 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-700">
                                            <i class="fas fa-hadith text-xl"></i>
                                        </div>
                                        <i class="fas fa-chevron-right text-slate-300 text-sm mt-2"></i>
                                    </div>
                                    <h3 class="font-bold text-lg text-slate-800 mt-3">${book.bookName}</h3>
                                    <div class="flex gap-3 mt-2 text-xs text-slate-500">
                                        <span><i class="far fa-copy"></i> ${book.chapters_count || '?'} Chapters</span>
                                        <span><i class="fas fa-hashtag"></i> ${book.hadiths_count || '?'} Hadiths</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchBooks() {
            isUsingFallback = false;
            renderUI();
            const listDiv = document.getElementById('book-list');
            if (listDiv) {
                listDiv.innerHTML = '<div class="col-span-3 text-center py-16"><i class="fas fa-spinner fa-spin text-3xl text-emerald-500"></i><p class="mt-3 text-slate-500">Connecting to server...</p></div>';
            }
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                
                const response = await fetch(`${WORKER_URL}/books`, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (data.books && Array.isArray(data.books) && data.books.length > 0) {
                    bookData = data.books;
                    isUsingFallback = false;
                    renderUI();
                    showToast(`✅ Loaded ${bookData.length} Hadith books`, "success");
                } else {
                    throw new Error("Invalid data format");
                }
            } catch (error) {
                console.warn("API Error:", error.message);
                showToast(`⚠️ Using offline data — API connection failed`, "info");
                isUsingFallback = true;
                bookData = [...FALLBACK_BOOKS];
                renderUI();
            }
        }

        function selectBook(slug, name) {
            selectedBookSlug = slug;
            selectedBookName = name;
            showToast(`📖 Selected: ${name} — loading chapters`, "info");
            chapterData = [];
            currentState = STATE.STEP_CHAPTER_SELECT;
            renderUI();
            fetchChapters();
        }

        function renderChapterSelection() {
            const displayChapters = chapterData.length > 0 ? chapterData : (FALLBACK_CHAPTERS[selectedBookSlug] || []);
            return `
                <div class="glass-card rounded-2xl shadow-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-blue-50 to-indigo-50 px-6 py-5 border-b border-blue-100">
                        <div class="flex justify-between items-center flex-wrap gap-3">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2"><i class="fas fa-layer-group text-blue-600"></i> Chapters of <span class="text-emerald-700">${selectedBookName}</span></h2>
                                <p class="text-slate-500 text-sm mt-1">Select a chapter to view narrations</p>
                            </div>
                            <button onclick="goBackToBooks()" class="bg-white/70 hover:bg-white text-slate-600 px-4 py-2 rounded-xl text-sm shadow-sm flex items-center gap-2"><i class="fas fa-arrow-left"></i> Back to Books</button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div id="chapter-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 max-h-[60vh] overflow-y-auto pr-2">
                            ${displayChapters.map(ch => `
                                <div onclick="selectChapter('${ch.chapterNumber}', '${(ch.name || '').replace(/'/g, "\\'")}')" 
                                    class="bg-white rounded-xl p-4 text-center cursor-pointer hover:shadow-md transition-all border border-slate-100 hover:border-blue-300">
                                    <span class="text-2xl font-bold text-blue-600">${ch.chapterNumber}</span>
                                    <p class="text-xs text-slate-600 font-medium mt-2 line-clamp-2">${ch.name || 'Chapter'}</p>
                                    <span class="inline-block mt-2 text-[11px] bg-slate-100 px-2 py-0.5 rounded-full text-slate-500">${ch.hadiths_count || '?'} narrations</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchChapters() {
            const listContainer = document.getElementById('chapter-list');
            if (listContainer) {
                listContainer.innerHTML = '<div class="col-span-full text-center py-16"><i class="fas fa-spinner fa-spin text-3xl text-emerald-500"></i><p class="mt-2">Loading chapters...</p></div>';
            }
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const response = await fetch(`${WORKER_URL}/${selectedBookSlug}/chapters`, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (data.chapters && Array.isArray(data.chapters) && data.chapters.length > 0) {
                    chapterData = data.chapters.map(ch => ({
                        name: ch.chapterEnglish || ch.chapterUrdu || ch.chapterArabic || `Chapter ${ch.chapterNumber}`,
                        hadiths_count: ch.hadiths_count || '—',
                        chapterNumber: ch.chapterNumber
                    }));
                    renderUI();
                    showToast(`📑 Loaded ${chapterData.length} chapters`, "success");
                } else {
                    throw new Error("No chapters");
                }
            } catch (error) {
                console.warn("Chapters API error, using fallback:", error.message);
                chapterData = FALLBACK_CHAPTERS[selectedBookSlug] || 
                    Array.from({ length: 20 }, (_, i) => ({ chapterNumber: i+1, name: `Chapter ${i+1}`, hadiths_count: Math.floor(Math.random() * 150) + 30 }));
                renderUI();
                showToast(`📑 Using offline chapters data for ${selectedBookName}`, "info");
            }
        }

        function goBackToBooks() {
            currentState = STATE.STEP_BOOK_SELECT;
            renderUI();
        }

        function selectChapter(chapterNum, chapterName) {
            selectedChapterNumber = chapterNum;
            selectedChapterName = chapterName;
            showToast(`📖 Chapter ${chapterNum} selected — loading narrations`, "info");
            currentHadithPage = 1;
            currentState = STATE.STEP_HADITH_VIEW;
            renderUI();
            fetchHadiths(true);
        }

        function renderHadithView() {
            return `
                <div class="glass-card rounded-2xl shadow-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-amber-50 to-orange-50 px-6 py-5 border-b border-amber-100">
                        <div class="flex flex-wrap justify-between items-center gap-3">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2"><i class="fas fa-scroll text-amber-600"></i> Hadith Narrations</h2>
                                <p class="text-slate-500 text-sm"><span class="font-semibold">${selectedBookName}</span> · Chapter ${selectedChapterNumber}: ${selectedChapterName || 'Selected Chapter'}</p>
                            </div>
                            <button onclick="goBackToChapters()" class="bg-white/80 hover:bg-white text-slate-600 px-4 py-2 rounded-xl text-sm shadow-sm flex items-center gap-2"><i class="fas fa-arrow-left"></i> Back to Chapters</button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div id="hadith-results" class="space-y-6 max-h-[65vh] overflow-y-auto pr-2">
                            <div class="text-center py-12"><i class="fas fa-spinner fa-spin text-3xl text-emerald-500"></i><p class="mt-3">Loading blessed narrations...</p></div>
                        </div>
                        <div class="mt-6 flex justify-center">
                            <button id="load-more-btn" class="bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-700 font-semibold py-3 px-8 rounded-xl transition-all flex items-center gap-2 shadow-sm">
                                <i class="fas fa-arrow-down"></i> Load More
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchHadiths(isReload = false) {
            const container = document.getElementById('hadith-results');
            const loadBtn = document.getElementById('load-more-btn');
            let targetPage = isReload ? 1 : currentHadithPage + 1;
            
            if (loadBtn) loadBtn.disabled = true;
            if (isReload && container) {
                container.innerHTML = '<div class="text-center py-12"><i class="fas fa-spinner fa-spin text-3xl text-emerald-500"></i><p class="mt-3">Loading hadiths...</p></div>';
            }

            try {
                const url = `${WORKER_URL}/hadiths?book=${selectedBookSlug}&chapter=${selectedChapterNumber}&page=${targetPage}&paginate=8`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (data.hadiths?.data && data.hadiths.data.length > 0) {
                    const hadithsArray = data.hadiths.data;
                    const pagination = {
                        current_page: data.hadiths.current_page,
                        last_page: data.hadiths.last_page,
                        next_page_url: data.hadiths.next_page_url
                    };
                    appendHadithsToDOM(hadithsArray, pagination, isReload, container);
                    currentHadithPage = pagination.current_page;
                    totalHadithPages = pagination.last_page;
                    if (loadBtn && pagination.next_page_url) {
                        loadBtn.disabled = false;
                        loadBtn.innerHTML = `<i class="fas fa-arrow-down"></i> Page ${pagination.current_page + 1}`;
                    } else if (loadBtn) {
                        loadBtn.disabled = true;
                        loadBtn.innerHTML = `<i class="fas fa-check-circle"></i> Complete Chapter`;
                    }
                    showToast(`Displaying page ${currentHadithPage} of ${totalHadithPages}`, "info");
                } else {
                    throw new Error("No data");
                }
            } catch (error) {
                console.warn("Hadith API error, using fallback:", error.message);
                const fallbackData = getFallbackHadiths(selectedBookSlug, selectedChapterNumber, targetPage, 8);
                appendHadithsToDOM(fallbackData.data, fallbackData, isReload, container);
                currentHadithPage = targetPage;
                totalHadithPages = fallbackData.last_page;
                if (loadBtn && targetPage < fallbackData.last_page) {
                    loadBtn.disabled = false;
                    loadBtn.innerHTML = `<i class="fas fa-arrow-down"></i> Page ${targetPage + 1}`;
                } else if (loadBtn) {
                    loadBtn.disabled = true;
                    loadBtn.innerHTML = `<i class="fas fa-check-circle"></i> Complete Chapter`;
                }
                showToast(`Using offline hadith data for preview`, "info");
            }
        }

        function appendHadithsToDOM(hadiths, pagination, isReload, container) {
            if (!container) return;
            const newCards = hadiths.map(hadith => renderHadithCard(hadith)).join('');
            if (isReload) {
                container.innerHTML = newCards || '<div class="text-center py-12 text-slate-400">No hadiths found in this chapter.</div>';
            } else {
                container.insertAdjacentHTML('beforeend', newCards);
            }
        }

        function renderHadithCard(hadith) {
            const narratorHtml = hadith.englishNarrator ? 
                `<div class="flex items-center gap-2 text-sm bg-amber-50 inline-block px-3 py-1.5 rounded-full text-amber-700 mb-3"><i class="fas fa-user-circle"></i> <span>${escapeHtml(hadith.englishNarrator)}</span></div>` : '';
            
            return `
                <div class="bg-white rounded-xl p-5 shadow-sm border-l-4 border-emerald-400 hover:shadow-md transition-all duration-200">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2">
                            <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full">#${hadith.hadithNumber}</span>
                        </div>
                        <i class="fas fa-quote-right text-emerald-200 text-xl"></i>
                    </div>
                    ${narratorHtml}
                    <div>
                        <p class="text-slate-700 leading-relaxed text-base">${escapeHtml(hadith.hadithEnglish || 'Text not available.')}</p>
                        ${hadith.hadithArabic ? `<p class="arabic-text text-right text-emerald-800 mt-4 pt-3 border-t border-slate-100 text-xl">${escapeHtml(hadith.hadithArabic)}</p>` : ''}
                        ${hadith.hadithUrdu ? `<p class="text-sm text-slate-500 mt-3 border-t pt-2"><span class="font-semibold">اردو:</span> ${escapeHtml(hadith.hadithUrdu)}</p>` : ''}
                    </div>
                </div>
            `;
        }

        function escapeHtml(str) { 
            if(!str) return ''; 
            return str.replace(/[&<>]/g, function(m){
                if(m==='&') return '&amp;'; 
                if(m==='<') return '&lt;'; 
                if(m==='>') return '&gt;'; 
                return m;
            }); 
        }
        
        function goBackToChapters() {
            currentState = STATE.STEP_CHAPTER_SELECT;
            renderUI();
        }
        
        function loadMoreHadiths() {
            if (currentHadithPage < totalHadithPages) {
                fetchHadiths(false);
            } else {
                showToast("You've reached the last page of this chapter.", "info");
                const btn = document.getElementById('load-more-btn');
                if(btn) btn.disabled = true;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateProgressSteps();
            fetchBooks();
        });
    </script>
